[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cherami"
version = "0.1.0"
description = "Official Cherami HTTP client: inboxes, correspondence, drafts, attachments and conversations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cherami" }]
dependencies = ["httpx>=0.28.1,<0.29"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://cherami.to"
Documentation = "https://cherami.to/docs/python"
Repository = "https://github.com/cherami-mail/cherami-python"
Issues = "https://github.com/cherami-mail/cherami-python/issues"

[dependency-groups]
dev = ["datamodel-code-generator==0.83.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cherami"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/examples", "/openapi.json", "/operations.json", "/pyproject.toml", "/uv.lock", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/.gitignore"]
